# guidance (remove in output): GitHub issue form for feature requests. Labels must exist in the repo.
# Keep the problem-first structure: it maps directly to PRD features (F-xx) and acceptance criteria. Tier: S E.
# Owner: {{owner}} · Last updated: {{yyyy_mm_dd}}
name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the **problem** first — the best solution may differ from the first idea.
        For open-ended questions or ideas, consider {{discussions_or_support_channel}} instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected and how often?
      placeholder: As a [type of user], I struggle to [task] because [reason].
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would we know this is done? Given / When / Then is welcome.
      placeholder: |
        Given [starting state]
        When [action]
        Then [observable result]
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have tried.
    validations:
      required: false
  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important
        - Blocking my use of the project
      default: 0
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute this?
      options:
        - "No"
        - Yes, with guidance
        - Yes, I can open a PR
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        # Keep the next option only if CODE_OF_CONDUCT.md is generated (open source); otherwise delete these two lines.
        - label: I agree to follow this project's [Code of Conduct](https://github.com/{{github_owner}}/{{repo_name}}/blob/{{default_branch}}/CODE_OF_CONDUCT.md).
          required: true
