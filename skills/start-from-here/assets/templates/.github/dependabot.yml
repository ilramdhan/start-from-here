# guidance (remove in output): OPTIONAL. Dependabot version updates config (.github/dependabot.yml).
# Create only if the repo is on GitHub and the team wants automated dependency PRs (alternative: Renovate — then omit this file).
# Rules: one entry per package ecosystem + directory that ACTUALLY exists in the repo. Valid ecosystems include:
#   npm (also yarn/pnpm), pip (also pipenv/poetry/pip-compile), uv, gomod, cargo, maven, gradle, nuget, bundler, composer,
#   mix, pub, swift, docker, docker-compose, terraform, helm, github-actions, devcontainers, gitsubmodule.
# Do not list ecosystems that are not present — Dependabot will error. Security updates are enabled separately in repository
# settings (Dependabot alerts + security updates). Grouping keeps PR volume manageable. New dependency *additions* still need
# human approval (AI_GUIDELINES §10); Dependabot only updates existing ones. Tier: S E. Owner: {{owner}}
version: 2
updates:
  - package-ecosystem: "{{package_ecosystem}}" # e.g. npm, pip, gomod, cargo, maven, gradle, nuget
    directory: "/" # location of the manifest (package.json, go.mod, pyproject.toml, ...)
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
